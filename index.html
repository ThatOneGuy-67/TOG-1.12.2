<button onclick="openGame()" id="game">
    GAME
</button>

<script>
function openGame() {
    const win = window.open("about:blank", "_blank");

    if (!win) {
        alert("Please allow pop-ups for this site.");
        return;
    }

    win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>TOG's Minecraft</title>
            <style>
                html, body {
                    margin: 0;
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                }
                iframe {
                    width: 100%;
                    height: 100%;
                    border: none;
                }
            </style>
        </head>
        <body>
            <iframe src="${new URL('Eaglercraft1.12.html', window.location.href).href}"></iframe>
        </body>
        </html>
    `);

    win.document.close();
}
</script>
